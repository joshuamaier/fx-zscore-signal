name: Daily FX update

on:
  schedule:
    - cron: "0 8 * * *" # täglich EZB-Kurse, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update FX data, run analysis, render chart
        env:
          QUOTE_BENCHMARK: equal
        run: python tasks/update_fx.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts docs blog
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily FX update $(date -u +%Y-%m-%d)"
            git push
          fi
